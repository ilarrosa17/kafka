apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kafka-infra-dev

resources:
  - ../../base

namePrefix: {{PREFIX}}

patches:
  # Reduce Kafka node pool replicas for dev environment and fix cluster label
  - patch: |-
      - op: replace
        path: 1
        value: {{REPLICAS}}
      - op: replace
        path: /metadata/labels/strimzi.io~1cluster
        value: dev-kafka-cluster
    target:
      kind: KafkaNodePool
      name: combined

  # Reduce replication factors for single-node dev cluster
  - patch: |-
      - op: replace
        path: /spec/kafka/config/offsets.topic.replication.factor
        value: {{REPLICAS}}
      - op: replace
        path: /spec/kafka/config/transaction.state.log.replication.factor
        value: {{REPLICAS}}
      - op: replace
        path: /spec/kafka/config/transaction.state.log.min.isr
        value: {{REPLICAS}}
      - op: replace
        path: /spec/kafka/config/default.replication.factor
        value: {{REPLICAS}}
      - op: replace
        path: /spec/kafka/config/min.insync.replicas
        value: {{REPLICAS}}
    target:
      kind: Kafka
      name: kafka-cluster

  # Lower replication for topics in dev
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: {{REPLICAS}}
    target:
      kind: KafkaTopic

labels:
  - pairs:
      environment: dev
      strimzi.io/cluster: dev-kafka-cluster
    includeSelectors: false

